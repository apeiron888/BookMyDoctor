version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - hams-network

  redis:
    image: redis:7
    networks:
      - hams-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=${PORT:-4000}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRES=${JWT_EXPIRES:-7d}
      - COOKIE_EXPIRE=${COOKIE_EXPIRE:-7}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_SECRET_KEY=${CLOUDINARY_SECRET_KEY}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:5174}
    depends_on:
      - mongodb
      - redis
    networks:
      - hams-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - hams-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:4000}
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - hams-network

volumes:
  mongo-data:

networks:
  hams-network:
    driver: bridge
